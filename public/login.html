<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - CoffeeHouse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>CoffeeHouse</h1>
    <h2>Entrar</h2>

    <form id="form-login">
      <input id="loginNome" type="text" placeholder="Nome de usuario" required>
      <input id="loginSenha" type="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>

    <p id="mensagem-auth" class="mensagem-auth"></p>

    <p class="auth-link">
      Ainda nao tem conta?
      <a href="cadastro.html">Cadastre-se</a>
    </p>

    <p class="auth-link-voltar">
      <a href="index.html">Voltar para Coffee-house </a>
    </p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
